version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - CIRCUITS_PATH=/app/circuits/build
    volumes:
      - ./packages/circuits/build:/app/circuits/build
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    ports:
      - '3000:3000'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  circuits_build:
